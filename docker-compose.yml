name: almuerzo-ya

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: almuerzo
      POSTGRES_PASSWORD: almuerzo
      POSTGRES_DB: almuerzo
    # Solo accesible desde este PC: la API se conecta por la red interna de Docker.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almuerzo"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://almuerzo:almuerzo@db:5432/almuerzo
      # Necesario para recargar cambios cuando el repo está en el disco de Windows.
      CHOKIDAR_USEPOLLING: "true"
    ports: ["3000:3000"]
    volumes: ["./api:/app", "/app/node_modules"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  mobile:
    build: ./mobile
    env_file: .env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP}
      EXPO_PUBLIC_API_URL: http://${HOST_LAN_IP}:3000
    ports: ["8081:8081"]
    # expo-home conserva la sesión de `expo login` entre reinicios.
    volumes: ["./mobile:/app", "/app/node_modules", "expo-home:/root/.expo"]
    stdin_open: true
    tty: true
    command: npx expo start --lan
    depends_on:
      api: { condition: service_healthy }

volumes:
  dbdata:
  expo-home:
