<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Confirmar pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E7B37}a:hover{color:#16602A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #000000">
  <div style="height: 108px; box-sizing: border-box; padding: 54px 16px 0; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
    <a href="Carrito.dc.html" aria-label="Volver al carrito" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #000000; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 #FFFFFF, 0 4px 14px rgba(0,0,0,0.08)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 600">Confirmar pedido</h1>
    <span></span>
  </div>

  <div style="padding: 8px 16px 140px; display: flex; flex-direction: column; gap: 22px">
    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding: 0 20px; font-size: 13px; font-weight: 400; color: #3C3C43; text-transform: uppercase">Tu pedido</h2>
      <div style="background: #FFFFFF; border-radius: 26px; padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px">
        <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: #FFE3CC; color: #A13D09; display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 21h8"></path><path d="M9 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"></path></svg>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #3C3C43">Menú 1</span>
          <span style="font-size: 17px; font-weight: 600">Pollo al jugo con arroz</span>
        </div>
        <span style="font-size: 17px">$ [PRECIO]</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding: 0 20px; font-size: 13px; font-weight: 400; color: #3C3C43; text-transform: uppercase">Hora de retiro</h2>
      <div style="background: #FFFFFF; border-radius: 26px; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ slots }}" as="s" hint-placeholder-count="6">
          <button type="button" onClick="{{ s.pick }}" disabled="{{ s.full }}" aria-pressed="{{ s.selected }}" style="height: 52px; border: 0; border-radius: 999px; cursor: pointer; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; background: {{s.bg}}; color: {{s.ink}}">
            <span style="font-size: 16px; font-weight: 600; text-decoration: {{s.strike}}">{{ s.time }}</span>
            <span style="font-size: 11px; font-weight: 500">{{ s.note }}</span>
          </button>
        </sc-for>
      </div>
      <p style="margin: 0; padding: 0 20px; font-size: 13px; line-height: 18px; color: #3C3C43">Retiras en Casino central. Tienes hasta 30 min desde la hora elegida.</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding: 0 20px; font-size: 13px; font-weight: 400; color: #3C3C43; text-transform: uppercase">Método de pago</h2>
      <div style="background: #FFFFFF; border-radius: 26px; overflow: hidden">
        <sc-for list="{{ pays }}" as="p" hint-placeholder-count="2">
          <button type="button" onClick="{{ p.pick }}" aria-pressed="{{ p.selected }}" style="width: 100%; min-height: 52px; border: 0; background: transparent; padding: 0 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; font: 400 17px -apple-system, system-ui, sans-serif; color: #000000; text-align: left; border-top: {{p.divider}}">
            <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: {{p.iconBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{ p.isApple }}" hint-placeholder-val="{{ true }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 14.5h2"></path><path d="M6 6V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path></svg>
              </sc-if>
              <sc-if value="{{ p.isWeb }}" hint-placeholder-val="{{ false }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"></rect><path d="M2 10h20M6 15h4"></path></svg>
              </sc-if>
            </span>
            <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; padding: 10px 0">
              <span>{{ p.label }}</span>
              <span style="font-size: 13px; color: #3C3C43">{{ p.sub }}</span>
            </span>
            <sc-if value="{{ p.selected }}" hint-placeholder-val="{{ false }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E7B37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </section>

    <div style="background: #FFFFFF; border-radius: 26px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 17px; font-weight: 600">Total</span>
      <span style="font-size: 17px; font-weight: 600">$ [PRECIO]</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 34px; background: rgba(242,242,247,0.6); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-top: 1px solid rgba(255,255,255,0.8)">
    <a href="{{ payHref }}" style="height: 52px; border-radius: 999px; background: {{payBg}}; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 24px rgba(0,0,0,0.2)">{{ payLabel }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const selSlot = st.slot || '12:30';
    const selPay = st.pay || 'apple';
    const times = [['12:00', true], ['12:30', false], ['13:00', false], ['13:30', false], ['14:00', false], ['14:30', false]];
    const slots = times.map((t) => {
      const sel = t[0] === selSlot;
      return {
        time: t[0], full: t[1], selected: sel,
        note: t[1] ? 'Lleno' : (sel ? 'Elegido' : 'Disponible'),
        bg: sel ? '#1E7B37' : (t[1] ? '#F2F2F7' : '#EEF7F0'),
        ink: sel ? '#FFFFFF' : (t[1] ? '#6C6C70' : '#16602A'),
        strike: t[1] ? 'line-through' : 'none',
        pick: () => { if (!t[1]) this.setState({ slot: t[0] }); }
      };
    });
    const pays = [['apple', 'Apple Pay', 'Pago rápido con Face ID', '#000000'], ['webpay', 'Webpay', 'Débito, crédito o prepago', '#0A64D8']].map((p, i) => ({
      label: p[1], sub: p[2], iconBg: p[3], isApple: p[0] === 'apple', isWeb: p[0] === 'webpay', selected: p[0] === selPay,
      divider: i === 0 ? '0' : '0.5px solid rgba(60,60,67,0.29)',
      pick: () => this.setState({ pay: p[0] })
    }));
    const apple = selPay === 'apple';
    return {
      slots: slots, pays: pays, chosen: selSlot,
      payHref: apple ? 'PagoApple.dc.html' : 'PagoWebpay.dc.html',
      payLabel: apple ? 'Pagar con Apple Pay' : 'Continuar a Webpay',
      payBg: apple ? '#000000' : '#1E7B37'
    };
  }
}
</script>
</body>
</html>
