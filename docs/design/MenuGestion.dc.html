<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gestión de menús</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E7B37}a:hover{color:#16602A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #000000">
  <div style="padding: 58px 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <span style="font-size: 15px; color: #3C3C43">Casino central</span>
      <a href="MenuNuevo.dc.html" aria-label="Agregar menú" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1E7B37; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid #FFFFFF; box-shadow: inset 0 1px 0 #FFFFFF, 0 4px 14px rgba(0,0,0,0.08)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
      </a>
    </div>
    <h1 style="margin: 0; padding: 0 4px; font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px">Menús</h1>

    <div role="group" aria-label="Día" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
        <button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.selected }}" style="height: 60px; border: 0; border-radius: 18px; cursor: pointer; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{d.bg}}; color: {{d.ink}}; box-shadow: {{d.shadow}}">
          <span style="font-size: 12px; font-weight: 600">{{ d.dow }}</span>
          <span style="font-size: 20px; font-weight: 700">{{ d.num }}</span>
          <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding: 0 20px; font-size: 13px; font-weight: 400; color: #3C3C43; text-transform: uppercase">{{ dayTitle }}</h2>
      <div style="background: #FFFFFF; border-radius: 26px; overflow: hidden">
        <sc-for list="{{ slots }}" as="s" hint-placeholder-count="2">
          <div style="border-top: {{s.divider}}">
            <sc-if value="{{ s.filled }}" hint-placeholder-val="{{ true }}">
              <a href="MenuNuevo.dc.html" style="padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #000000">
                <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; background: {{s.tile}}; color: {{s.tileInk}}; display: flex; align-items: center; justify-content: center">
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 21h8"></path><path d="M9 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"></path></svg>
                </div>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 13px; color: #3C3C43">{{ s.label }} · Stock {{ s.stock }}</span>
                  <span style="font-size: 17px; font-weight: 600; line-height: 22px">{{ s.name }}</span>
                  <span style="align-self: flex-start; margin-top: 2px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: {{s.stBg}}; color: {{s.stInk}}">{{ s.status }}</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
              </a>
            </sc-if>
            <sc-if value="{{ s.empty }}" hint-placeholder-val="{{ false }}">
              <a href="MenuNuevo.dc.html" style="padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px; text-decoration: none">
                <div style="width: 56px; height: 56px; flex: none; border-radius: 16px; border: 1.5px dashed #AEAEB2; box-sizing: border-box; color: #1E7B37; display: flex; align-items: center; justify-content: center">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
                </div>
                <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 13px; color: #3C3C43">{{ s.label }}</span>
                  <span style="font-size: 17px; font-weight: 600">Agregar plato</span>
                </div>
              </a>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; padding: 0 20px; font-size: 13px; font-weight: 400; color: #3C3C43; text-transform: uppercase">Ajustes del día</h2>
      <div style="background: #FFFFFF; border-radius: 26px; overflow: hidden">
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span>Cierre de reservas</span><span style="color: #3C3C43">11:30</span>
        </div>
        <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 20px"></div>
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span>Horario de retiro</span><span style="color: #3C3C43">12:00 – 15:00</span>
        </div>
      </div>
    </section>
  </div>

  <nav aria-label="Operador" style="position: absolute; left: 40px; right: 40px; bottom: 26px; height: 64px; box-sizing: border-box; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 30px rgba(0,0,0,0.14); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
    <a href="Escanear.dc.html" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #000000; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"></path></svg>Escanear</a>
    <a href="Stock.dc.html" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #000000; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4z"></path><path d="M3 7v10l9 4 9-4V7"></path><path d="M12 11v10"></path></svg>Stock</a>
    <a href="MenuGestion.dc.html" aria-current="page" style="border-radius: 999px; background: rgba(0,0,0,0.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #16602A; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Menús</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.day) || 24;
    const data = {
      23: [{ name: 'Carne mechada con puré', stock: 110, status: 'Finalizado' }, { name: 'Charquicán de verduras', stock: 90, status: 'Finalizado' }],
      24: [{ name: 'Pollo al jugo con arroz', stock: 120, status: 'Publicado' }, { name: 'Lasaña de verduras', stock: 100, status: 'Publicado' }],
      25: [{ name: 'Pescado frito con ensalada', stock: 110, status: 'Programado' }, null],
      26: [null, null],
      27: [null, null]
    };
    const dows = { 23: 'LUN', 24: 'MAR', 25: 'MIÉ', 26: 'JUE', 27: 'VIE' };
    const names = { 23: 'Lunes 23', 24: 'Hoy · martes 24', 25: 'Miércoles 25', 26: 'Jueves 26', 27: 'Viernes 27' };
    const days = [23, 24, 25, 26, 27].map((n) => {
      const s = n === sel;
      const complete = data[n].every((x) => x);
      return {
        dow: dows[n], num: n, selected: s,
        bg: s ? '#1E7B37' : '#FFFFFF', ink: s ? '#FFFFFF' : '#000000',
        shadow: s ? '0 6px 16px rgba(30,123,55,0.3)' : 'none',
        dot: complete ? (s ? '#FFFFFF' : '#1E7B37') : (s ? 'rgba(255,255,255,0.5)' : '#C93400'),
        pick: () => this.setState({ day: n })
      };
    });
    const stStyle = { 'Publicado': ['#D8F0DC', '#16602A'], 'Programado': ['#DCE9FB', '#0850AD'], 'Finalizado': ['#E5E5EA', '#3C3C43'] };
    const tiles = [['#FFE3CC', '#A13D09'], ['#D8F0DC', '#1E7B37']];
    const slots = data[sel].map((m, i) => {
      const base = { label: 'Menú ' + (i + 1), divider: i === 0 ? '0' : '0.5px solid rgba(60,60,67,0.29)', filled: !!m, empty: !m, tile: tiles[i][0], tileInk: tiles[i][1] };
      if (!m) return base;
      return Object.assign(base, { name: m.name, stock: m.stock, status: m.status, stBg: stStyle[m.status][0], stInk: stStyle[m.status][1] });
    });
    return { days: days, slots: slots, dayTitle: names[sel] };
  }
}
</script>
</body>
</html>
