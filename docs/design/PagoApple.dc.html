<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pago con Apple Pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D8}a:hover{color:#0850AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #000000">
  <div aria-hidden="true" style="padding: 62px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="height: 20px; width: 160px; margin: 0 auto; border-radius: 6px; background: #D1D1D6"></div>
    <div style="height: 80px; border-radius: 26px; background: #FFFFFF"></div>
    <div style="height: 140px; border-radius: 26px; background: #FFFFFF"></div>
    <div style="height: 104px; border-radius: 26px; background: #FFFFFF"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.38)"></div>

  <div role="dialog" aria-label="Apple Pay" style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: #FFFFFF; border-radius: 40px; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 40px rgba(0,0,0,0.25)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.2px">Apple Pay</span>
      <a href="Checkout.dc.html" aria-label="Cancelar" style="width: 36px; height: 36px; border-radius: 18px; background: #E9E9EE; color: #3C3C43; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="background: #F2F2F7; border-radius: 20px; overflow: hidden">
      <div style="min-height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
        <div aria-hidden="true" style="width: 46px; height: 30px; border-radius: 5px; background: #1C1C1E; position: relative">
          <div style="position: absolute; left: 6px; bottom: 6px; width: 14px; height: 3px; border-radius: 2px; background: #8E8E93"></div>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; font-weight: 600">Tarjeta de débito</span>
          <span style="font-size: 15px; color: #3C3C43">•••• 4821</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
      <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 16px"></div>
      <div style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
        <span style="color: #3C3C43">Contacto</span><span>nombre@universidad.cl</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
      <div style="display: flex; justify-content: space-between; font-size: 15px; color: #3C3C43">
        <span>Menú 1 · Pollo al jugo (x1)</span><span>$ [PRECIO]</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 0.5px solid rgba(60,60,67,0.29)">
        <span style="font-size: 13px; font-weight: 600; color: #3C3C43; letter-spacing: 0.3px">PAGAR A ALMUERZO YA</span>
        <span style="font-size: 22px; font-weight: 700">$ [TOTAL]</span>
      </div>
    </div>

    <sc-if value="{{ pending }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ confirm }}" style="border: 0; background: transparent; cursor: pointer; padding: 10px 0 0; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: -apple-system, system-ui, sans-serif; color: #000000">
        <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 32px; border: 2px solid #0A64D8; color: #0A64D8; display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="3"></rect><path d="M20 7v5"></path></svg>
        </span>
        <span style="font-size: 17px; font-weight: 600">Confirma con el botón lateral</span>
        <span style="font-size: 13px; color: #3C3C43">Haz doble clic y usa Face ID</span>
      </button>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div style="padding-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 32px; background: #0A64D8; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="font-size: 17px; font-weight: 600">Listo</span>
        <a href="PagoExitoso.dc.html" style="width: 100%; height: 52px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Continuar</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = !!(this.state && this.state.done);
    return { pending: !done, done: done, confirm: () => this.setState({ done: true }) };
  }
}
</script>
</body>
</html>
