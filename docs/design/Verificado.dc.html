<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Validar y entregar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E7B37}a:hover{color:#16602A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E0E10; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', sans-serif; color: #000000">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: 40px; width: 300px; height: 300px; border-radius: 50%; background: #262628"></div>
  <div aria-hidden="true" style="position: absolute; right: -60px; top: 0; width: 240px; height: 240px; border-radius: 50%; background: #1E2A22"></div>

  <div style="position: absolute; left: 8px; right: 8px; top: 140px; bottom: 8px; background: #F2F2F7; border-radius: 40px; padding: 8px 16px 26px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -10px 40px rgba(0,0,0,0.35)">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
      <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC"></div>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: -10px">
      <a href="Escanear.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #000000; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid #FFFFFF; box-shadow: 0 4px 14px rgba(0,0,0,0.08)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-top: -16px">
      <div style="width: 84px; height: 84px; border-radius: 42px; background: {{iconBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35)">
        <sc-if value="{{ isOk }}" hint-placeholder-val="{{ true }}">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </sc-if>
        <sc-if value="{{ isUsed }}" hint-placeholder-val="{{ false }}">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8M12 18h.01"></path></svg>
        </sc-if>
        <sc-if value="{{ isBad }}" hint-placeholder-val="{{ false }}">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; font-size: 28px; line-height: 34px; font-weight: 700">{{ title }}</h1>
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: #3C3C43">{{ subtitle }}</p>
      </div>
    </div>

    <sc-if value="{{ showDetails }}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border-radius: 26px; overflow: hidden">
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span style="color: #3C3C43">Pedido</span><span style="font-weight: 600; letter-spacing: 0.5px">A7F3-29</span>
        </div>
        <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 20px"></div>
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span style="color: #3C3C43">Estudiante</span><span style="font-weight: 600">Camila Rojas</span>
        </div>
        <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 20px"></div>
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span style="color: #3C3C43">Menú</span><span style="font-weight: 600">Menú 1 · Pollo al jugo</span>
        </div>
        <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 20px"></div>
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span style="color: #3C3C43">Retiro</span><span style="font-weight: 600">12:30 – 13:00</span>
        </div>
        <div style="height: 0.5px; background: rgba(60,60,67,0.29); margin-left: 20px"></div>
        <div style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 17px">
          <span style="color: #3C3C43">Pago</span><span style="font-weight: 600; color: #1E7B37">Pagado</span>
        </div>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{ showConfirm }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ confirm }}" style="height: 56px; border: 0; border-radius: 999px; background: #1E7B37; color: #FFFFFF; font: 600 17px -apple-system, system-ui, sans-serif; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 24px rgba(30,123,55,0.3)">Confirmar entrega</button>
        <a href="#" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; text-decoration: none; color: #D70015">Reportar un problema</a>
      </sc-if>
      <sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
        <a href="Escanear.dc.html" style="height: 56px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{ nextLabel }}</a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["Válido","Ya entregado","No válido"],"default":"Válido","section":"Resultado del escaneo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const res = this.props.result ?? 'Válido';
    const done = !!(this.state && this.state.done);
    const confirm = () => this.setState({ done: true });
    if (res === 'Ya entregado') {
      return { isOk: false, isUsed: true, isBad: false, iconBg: '#C93400', title: 'Ya fue entregado', subtitle: 'Este pedido se entregó hoy a las 12:18 en el Mesón 1.', showDetails: true, showConfirm: false, showNext: true, nextLabel: 'Escanear otro', confirm: confirm };
    }
    if (res === 'No válido') {
      return { isOk: false, isUsed: false, isBad: true, iconBg: '#D70015', title: 'Código no válido', subtitle: 'No corresponde a un pedido pagado de hoy.', showDetails: false, showConfirm: false, showNext: true, nextLabel: 'Volver a escanear', confirm: confirm };
    }
    return {
      isOk: true, isUsed: false, isBad: false, iconBg: '#1E7B37',
      title: done ? 'Entregado' : 'Código válido',
      subtitle: done ? 'Registrado a las 12:41 · Stock actualizado' : 'Entrega el Menú 1 y confirma.',
      showDetails: true, showConfirm: !done, showNext: done, nextLabel: 'Escanear siguiente', confirm: confirm
    };
  }
}
</script>
</body>
</html>
