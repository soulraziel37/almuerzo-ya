# Demo publicada: app web, API y base de datos en el plan gratuito de Render.
# La base gratuita expira 30 días después de crearla.
databases:
  - name: almuerzo-ya-db
    plan: free
    databaseName: almuerzo
    ipAllowList: [] # solo accesible desde los servicios de Render

services:
  - type: web
    name: almuerzo-ya-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: almuerzo-ya-db
          property: connectionString
      - key: AUTH_MODE
        value: mock
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: ENFORCE_RESERVATION_WINDOW
        value: "false"
      # Render está delante como proxy; comprobar en los logs que la IP sea la del cliente.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Render las pide al crear el servicio; no se guardan en el repositorio.
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      # Dirección de la app web, sin / final: otros sitios no pueden llamar a la API.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: almuerzo-ya
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    autoDeploy: false
    # La app es de una sola página: cualquier ruta abre index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dirección de la API. Queda fija al compilar: si cambia, hay que volver a desplegar.
      - key: EXPO_PUBLIC_API_URL
        sync: false
